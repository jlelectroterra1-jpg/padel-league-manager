name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # apple-watch-scorer/ is a separate Swift/Xcode source tree (no web
      # content) that lives in this repo for convenience but was never meant
      # to be published as part of the site - exclude it (and .git) here
      # rather than changing what "." meant for the actual web app.
      # supabase/ holds the PayFast Edge Function source (deployed to
      # Supabase, not served from the site), so it is excluded too.
      - name: Stage site (exclude non-web source folders)
        run: |
          mkdir -p _site
          rsync -a --exclude='_site' --exclude='.git' --exclude='apple-watch-scorer' --exclude='supabase' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
