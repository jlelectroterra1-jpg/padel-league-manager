<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#14213D">
<title>Padel League Manager</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/logo-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/logo-16.png">
</head>
<body>
<script>
// GitHub Pages serves this file (with an HTTP 404 status, but the content
// still loads and runs) for any URL that doesn't match a real file. We use
// that to support clean team links like ".../team/ABCDEF" or ".../t/ABCDEF"
// on a plain static host: pull the code out of the path and hand off to the
// real team.html?code=... page, which team-view.js then rewrites the address
// bar back to the clean form via history.replaceState (see team-view.js).
// Anything else unmatched goes to the site root - which always resolves
// (see index.html) rather than to path's own parent directory, which could
// just as easily not exist either and 404 straight back into this same
// script, looping forever (this is exactly what happened with a bare "/"
// before index.html existed, and would happen again for any other
// nonexistent directory-shaped path otherwise - e.g. a stray link to a
// folder that isn't published, like this repo's apple-watch-scorer/).
(function () {
  var path = window.location.pathname;
  var club = path.match(/\/club\/([^\/]+)\/?$/);
  var idx = path.search(/\/(?:team|t)\/[^\/]+\/?$/);
  if (club) {
    // Club links: ".../club/padel-up" -> club.html?c=padel-up (club-view.js
    // puts the clean address back in the bar).
    window.location.replace(window.location.origin + "/club.html?c=" + encodeURIComponent(decodeURIComponent(club[1])));
  } else if (idx !== -1) {
    var base = path.slice(0, idx + 1);
    var code = decodeURIComponent(path.slice(idx).match(/\/(?:team|t)\/([^\/]+)\/?$/)[1]);
    window.location.replace(base + "team.html?code=" + encodeURIComponent(code));
  } else {
    window.location.replace(window.location.origin + "/");
  }
})();
</script>
<p>Redirecting&hellip;</p>
</body>
</html>
